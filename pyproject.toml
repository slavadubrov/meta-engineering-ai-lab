[project]
name = "closed-loop-ai-lab"
version = "0.1.0"
description = "A reproducible, artifact-first experiment loop for synthetic agent memory"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff==0.15.2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv]
package = false
