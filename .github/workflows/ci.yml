name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s scripts -v
      - run: uv run --frozen python scripts/fetch_evidence.py
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen ruff check lab tests scripts
      - run: uv run --frozen ruff format --check lab tests scripts
      - run: uv run --frozen python -m lab verify artifacts/article-01.1
      - run: uv run --frozen python -m lab verify artifacts/article-01.2
      - run: uv run --frozen python -m lab verify artifacts/article-01.3
      - run: uv run --frozen python -m lab verify artifacts/article-01.4
      - run: uv run --frozen python -m lab verify artifacts/article-01.5
      - run: uv run --frozen python -m lab verify artifacts/article-01.6 --source
      - run: uv run --frozen python -m lab verify artifacts/agent-study-01
      - run: uv run --frozen python -m lab verify artifacts/agent-study-02
      - run: uv run --frozen python -m lab verify artifacts/agent-study-03 --source
      - run: uv run --frozen python -m lab site --output site
      - run: node --check web/app.js
      - run: node --check web/campaign.js
