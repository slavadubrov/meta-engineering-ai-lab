name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s scripts -v
      - run: uv run --frozen python scripts/fetch_evidence.py
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen ruff check lab tests scripts
      - run: uv run --frozen ruff format --check lab tests scripts
      - run: uv run --frozen python -m lab verify artifacts/article-01.1
      - run: uv run --frozen python -m lab verify artifacts/article-01.2
      - run: uv run --frozen python -m lab verify artifacts/article-01.3
      - run: uv run --frozen python -m lab verify artifacts/article-01.4
      - run: uv run --frozen python -m lab verify artifacts/article-01.5
      - run: uv run --frozen python -m lab verify artifacts/article-01.6
      - run: uv run --frozen python -m lab verify artifacts/agent-study-01
      - run: uv run --frozen python -m lab verify artifacts/agent-study-02
      - run: uv run --frozen python -m lab verify artifacts/agent-study-03
      - run: uv run --frozen python -m lab verify reports/article-02/grid
      - run: uv run --frozen python -m lab verify reports/article-02/jev
      # The README quick start, as a reader runs it.
      - run: uv run --frozen python -m lab.evaluator_exploits --output artifacts/my-evaluator-study
      - run: uv run --frozen python -m lab verify artifacts/my-evaluator-study
      - run: cmp artifacts/my-evaluator-study/report.md reports/article-02/grid/report.md
      - run: uv run --frozen python -m lab.jev_compare --output artifacts/jev-offline
      - run: uv run --frozen python -m lab verify artifacts/jev-offline
      - run: uv run --frozen python -m lab site --output site
      - run: node --check web/app.js
      - run: node --check web/campaign.js
      - run: node --check web/evaluators.js
      - name: Browser smoke test of all three pages
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false puppeteer@24
          uv run --frozen python -m lab serve --port 8075 &
          sleep 2
          node web/smoke.mjs http://127.0.0.1:8075/web/
